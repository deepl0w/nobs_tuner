name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The real-recording tests skip without these, so fetch them when the
      # upstream host is reachable and carry on when it is not.
      - name: Fetch instrument recordings
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          tools/fetch-test-audio.sh

      # The pitch chain lives in :core now, so :app alone no longer covers it.
      - name: Unit tests
        run: ./gradlew :core:jvmTest :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintRelease

      # The ADRs link to the source they are about, so moving a file turns them
      # into 404s that nobody notices until a reader follows one.
      - name: Check documentation links
        run: tools/check-doc-links.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore

  bundle:
    name: Release bundle
    runs-on: ubuntu-latest
    needs: check
    # Only build a signed artefact for the main branch; pull requests from forks
    # cannot read the signing secrets anyway.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
